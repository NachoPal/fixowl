# actions/labeler v5 config: maps changed paths to `area:` labels.
# One entry per monorepo surface (see AGENTS.md "Layout"). Schema:
# https://github.com/actions/labeler#configuration-options
#
# Consumed by .github/workflows/labeler.yml. `sync-labels: true` there means an
# `area:` label is removed again if a later push drops the matching paths, so
# these globs are the single source of truth for area labeling.

"area: cli":
  - changed-files:
      - any-glob-to-any-file:
          - "packages/cli/**"

"area: core":
  - changed-files:
      - any-glob-to-any-file:
          - "packages/core/**"

"area: action":
  - changed-files:
      - any-glob-to-any-file:
          - "packages/action/**"
          - "action.yml"

"area: release":
  - changed-files:
      - any-glob-to-any-file:
          - "scripts/**"
          - ".github/workflows/release.yml"

# Other CI: any workflow EXCEPT the release workflow (that is `area: release`).
# `all-globs-to-any-file` is true iff at least one changed file matches ALL of
# these globs at once (labeler evaluates the two globs against the SAME file):
# a file under .github/workflows/** AND, via Minimatch negation, not release.yml.
# So the label fires exactly when some non-release workflow changed - a PR that
# touches ONLY release.yml never matches (that is `area: release`), and a mixed
# PR touching release.yml plus another workflow still gets `area: ci` for the
# real CI change. This deliberately replaces the earlier two-rule form, whose
# clauses labeler ORs (not ANDs), so the negated clause fired on nearly every PR.
"area: ci":
  - changed-files:
      - all-globs-to-any-file:
          - ".github/workflows/**"
          - "!.github/workflows/release.yml"

# Docs: the docs/ tree and the top-level README. NOT a bare `*.md`, which also
# catches root AGENTS.md / CLAUDE.md - those are agent-instruction files, not
# documentation, and must not carry `area: docs`.
"area: docs":
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**"
          - "README.md"
