name: release

# Manually-triggered release of the BASE version committed in the code, with the
# channel and any prerelease suffix chosen at trigger time.
#
# The workflow NEVER bumps, commits, or pushes a version: a human edits the base
# version in packages/cli/package.json (the single source of truth), commits,
# pushes, then dispatches this. The `version_suffix` input is appended
# verbatim to that base version and applied only ephemerally in-CI for the
# publish; `release_type` picks the channel. See docs/releasing.md.
#
# Gating: `publish` runs only after `verify` (deterministic) AND the E2E gates
# `e2e-free` (BLOCKING, zero-spend scenario suite) and `e2e-paid` (report-only, a
# real agent call). `dry_run` runs everything except the publish side effects;
# `skip_e2e` lets a hotfix skip the E2E gates (loudly noted in the summary).

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Channel: release (stable), prerelease, or draft (prepare only, nothing ships)"
        type: choice
        options:
          - release
          - prerelease
          - draft
        default: release
      version_suffix:
        description: "Appended verbatim to the base version, e.g. -rc.1 (empty for a plain version)"
        type: string
        default: ""
      dry_run:
        description: "Run everything except npm publish, tag push, and Release creation"
        type: boolean
        default: false
      skip_e2e:
        description: "Skip the E2E gates (e2e-free + e2e-paid). For a hotfix when the sandbox is unavailable."
        type: boolean
        default: false

permissions:
  contents: write # push git tags and create the GitHub Release (in publish)
  id-token: write # npm OIDC trusted publishing (auth + provenance), no token

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Deterministic gate: lint, test, build + bundle-freshness guard, the in-process real-docker
  # night (pnpm e2e:docker), and the CLI smokes. No side effects, so contents: read only.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build and guard against a stale committed bundle
        run: |
          pnpm build
          git diff --exit-code -- dist

      # Whole-night against a REAL Docker engine (fake GitHub): git-dir extraction, the
      # planted-hook non-execution, the token non-leak, the evidence layout, and offline
      # pnpm as a non-root container user (T3-pnpm). Ubuntu runners ship Docker.
      - name: Docker E2E (pnpm e2e:docker)
        run: pnpm e2e:docker

      # CLI smokes of the built `fixowl` binary (no network writes; covers T5-manual-provision,
      # the runtime_token migration, `init --non-interactive`, and "aider is gone").
      - name: CLI smokes
        run: bash scripts/e2e/cli-smokes.sh

  # Free, zero-spend scenario suite (the `script` adapter) against the shared sandbox - the
  # BLOCKING E2E gate. Runs under the e2e-run wrapper action so ACTIONS_RUNTIME_TOKEN is
  # present and the evidence-kill scenario's progressive upload lands in THIS run.
  e2e-free:
    name: E2E free (scenario suite)
    needs: [verify]
    if: ${{ inputs.skip_e2e == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read # checkout only; the sandbox is reached with its own App token
      actions: read # list this run's evidence artifacts (evidence-kill assertion)
    concurrency:
      group: fixowl-e2e-sandbox # serialize every workflow that touches the one shared sandbox
      cancel-in-progress: false
    env:
      SANDBOX_REPO: NachoPal/fixowl-e2e-sandbox
      E2E_MODE: free
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        with:
          app-id: ${{ secrets.FIXOWL_E2E_APP_ID }}
          private-key: ${{ secrets.FIXOWL_E2E_APP_PRIVATE_KEY }}
          owner: NachoPal
          repositories: fixowl-e2e-sandbox

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the action bundle under test
        run: pnpm build

      - name: Checkout the sandbox repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: NachoPal/fixowl-e2e-sandbox
          token: ${{ steps.app-token.outputs.token }}
          path: sandbox
          fetch-depth: 0
          persist-credentials: false # the action pushes with its own App token

      - name: Run the free scenario suite
        uses: ./.github/actions/e2e-run
        with:
          # Suite mode: the wrapper spawns the runner as a child so it (and every `node`
          # it runs) inherits ACTIONS_RUNTIME_TOKEN - the one thing a `run:` step cannot get.
          command: bash scripts/e2e/run-scenarios.sh
        env:
          SANDBOX_REPO: NachoPal/fixowl-e2e-sandbox
          GH_TOKEN: ${{ steps.app-token.outputs.token }} # fixture gh calls only; never the agent's
          FIXOWL_APP_ID: ${{ secrets.FIXOWL_E2E_APP_ID }}
          FIXOWL_APP_INSTALLATION_ID: ${{ steps.app-token.outputs.installation-id }}
          FIXOWL_APP_PRIVATE_KEY: ${{ secrets.FIXOWL_E2E_APP_PRIVATE_KEY }}
          # Optional evidence-kill cross-check against this run's own artifacts.
          FIXOWL_SELF_TOKEN: ${{ github.token }}
          FIXOWL_SELF_REPO: ${{ github.repository }}
          FIXOWL_RUN_ID: ${{ github.run_id }}

  # Real-call E2E: one real claude (sonnet/medium) night against the sandbox via the wrapper
  # action (direct mode), reusing the baseline seed/assert/cleanup scripts. REPORT-ONLY: a
  # paid, nondeterministic agent must not veto a release on its first flake. Runs after
  # e2e-free so the two never contend for the shared sandbox concurrency group in one run.
  e2e-paid:
    name: E2E paid (real sonnet call)
    needs: [verify, e2e-free]
    if: ${{ inputs.skip_e2e == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true # report-only to start; promote once the flake rate is known
    permissions:
      contents: read
    concurrency:
      group: fixowl-e2e-sandbox
      cancel-in-progress: false
    env:
      SANDBOX_REPO: NachoPal/fixowl-e2e-sandbox
      E2E_MODE: paid
      RUN_TAG: paid-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        with:
          app-id: ${{ secrets.FIXOWL_E2E_APP_ID }}
          private-key: ${{ secrets.FIXOWL_E2E_APP_PRIVATE_KEY }}
          owner: NachoPal
          repositories: fixowl-e2e-sandbox

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the action bundle under test
        run: pnpm build

      - name: Checkout the sandbox repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: NachoPal/fixowl-e2e-sandbox
          token: ${{ steps.app-token.outputs.token }}
          path: sandbox
          fetch-depth: 0
          persist-credentials: false

      - name: Seed sandbox fixtures
        id: seed
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }} # for the fixture gh calls
        run: bash scripts/e2e/seed.sh

      - name: Run fixowl against the sandbox (real sonnet call)
        id: run
        uses: ./.github/actions/e2e-run
        with:
          # Direct mode: the wrapper retargets GITHUB_* at the sandbox and runs the bundle in
          # its own process (so evidence uploads into this run), no shell export trick.
          repository: NachoPal/fixowl-e2e-sandbox
          workspace: ${{ github.workspace }}/sandbox
          event-name: workflow_dispatch # keep the scheduled-slot budget guard inert
        env:
          FIXOWL_APP_ID: ${{ secrets.FIXOWL_E2E_APP_ID }}
          FIXOWL_APP_INSTALLATION_ID: ${{ steps.app-token.outputs.installation-id }}
          FIXOWL_APP_PRIVATE_KEY: ${{ secrets.FIXOWL_E2E_APP_PRIVATE_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          INPUT_LABELS-ANY: "for: ci-e2e"
          INPUT_AGENT: claude
          INPUT_AGENT-ENV: CLAUDE_CODE_OAUTH_TOKEN
          INPUT_DEFAULT-MODEL: sonnet
          INPUT_DEFAULT-EFFORT: medium
          INPUT_LABEL-MODELS: "" # empty => every issue falls back to sonnet/medium
          INPUT_MAX-ISSUES-PER-RUN: "3"
          INPUT_ISSUE-TIMEOUT-MINUTES: "15"
          INPUT_MAX-CI-TRIES: "2"
          INPUT_CI-TIMEOUT-MINUTES: "15"
          INPUT_HEURISTIC-CONFLICT-ORDERING: "false"

      - name: Assert delivery (loose)
        id: assert
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }} # for the fixture gh calls
          A: ${{ steps.seed.outputs.A }}
          B: ${{ steps.seed.outputs.B }}
        run: bash scripts/e2e/assert.sh

      - name: Tear down sandbox fixtures
        if: always()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }} # for the fixture gh calls
          A: ${{ steps.seed.outputs.A }}
          B: ${{ steps.seed.outputs.B }}
        run: bash scripts/e2e/cleanup.sh

      - name: E2E summary
        if: always()
        env:
          RUN_OUTCOME: ${{ steps.run.outcome }}
          ASSERT_OUTCOME: ${{ steps.assert.outcome }}
        run: |
          {
            echo "## fixowl real-call E2E (report-only)"
            echo ""
            echo "- Sandbox: \`${SANDBOX_REPO}\` (run tag \`${RUN_TAG}\`)"
            echo "- Action run step: **${RUN_OUTCOME}**"
            echo "- Loose assertions: **${ASSERT_OUTCOME}**"
            echo ""
            if [ "${ASSERT_OUTCOME}" = "success" ]; then
              echo "PASS: real agent -> docker -> push -> PR -> CI-gate -> ready, with blocked_by stacking."
            else
              echo "NOT PASSING (report-only, does not block the release). Investigate above."
            fi
            echo ""
            echo "### Coverage honesty"
            echo "This validates only the **GitHub-hosted** action->docker->agent->push->PR->CI-gate path."
            echo "It does **NOT** cover: self-hosted runner registration (\`fixowl provision\`/\`registerRunner\`),"
            echo "the launchd local fallback trigger, or the once-a-day scheduled-slot budget guard"
            echo "(inert on manual dispatch). Those remain covered only by unit tests."
          } >> "${GITHUB_STEP_SUMMARY}"

  # Plan, preflight, and the publish side effects. Runs only after verify and both E2E gates.
  # e2e-free is BLOCKING (a failure blocks publish); e2e-paid is continue-on-error (never
  # blocks); either is skipped when skip_e2e is set (a skipped need never blocks publish).
  publish:
    needs: [verify, e2e-free, e2e-paid]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A job-level permissions block REPLACES the workflow-level one, so re-declare both.
    permissions:
      contents: write # push git tags and create the GitHub Release
      id-token: write # npm OIDC trusted publishing
    steps:
      - name: Note skipped E2E gates
        if: ${{ inputs.skip_e2e == true }}
        run: |
          {
            echo "## ⚠️ E2E GATES SKIPPED"
            echo ""
            echo "This release was dispatched with \`skip_e2e: true\`: the BLOCKING free scenario suite"
            echo "and the report-only paid E2E did **not** run. Only \`verify\` (lint/test/build/docker/CLI)"
            echo "gated this release. Use this only for a hotfix when the sandbox is unavailable."
          } >> "${GITHUB_STEP_SUMMARY}"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Credentials are persisted so the release can push tags; unlike CI,
          # this job legitimately writes to the repo (contents: write above).
          persist-credentials: true

      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Compute release plan
        id: plan
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
          VERSION_SUFFIX: ${{ inputs.version_suffix }}
        run: node scripts/release-plan.ts

      - name: Preflight - version not already on npm, tag not already present
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          GIT_TAG: ${{ steps.plan.outputs.git_tag }}
          PUBLISH_NPM: ${{ steps.plan.outputs.publish_npm }}
          PUSH_GIT_TAG: ${{ steps.plan.outputs.push_git_tag }}
        run: |
          set -euo pipefail
          if [ "${PUBLISH_NPM}" = "true" ]; then
            published="$(npm view "fixowl@${VERSION}" version 2>/dev/null || true)"
            if [ -n "${published}" ]; then
              echo "fixowl@${VERSION} is already published on npm. Bump the base version and commit, or change version_suffix." >&2
              exit 1
            fi
          fi
          if [ "${PUSH_GIT_TAG}" = "true" ]; then
            if git ls-remote --exit-code --tags origin "refs/tags/${GIT_TAG}" >/dev/null 2>&1; then
              echo "Git tag ${GIT_TAG} already exists on origin." >&2
              exit 1
            fi
          fi

      - name: Ensure npm supports OIDC trusted publishing
        if: ${{ inputs.dry_run == false && steps.plan.outputs.publish_npm == 'true' }}
        run: |
          set -euo pipefail
          # Trusted publishing (OIDC) requires npm >= 11.5.1. The npm bundled
          # with Node 24 can be older, so upgrade to a known-good version.
          npm install -g npm@latest
          npm --version

      - name: Set composed version (ephemeral, never committed)
        if: ${{ inputs.dry_run == false && steps.plan.outputs.publish_npm == 'true' }}
        working-directory: packages/cli
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        # Applies base + suffix to packages/cli/package.json so `npm publish`
        # ships the right version. --no-git-tag-version makes no commit or tag;
        # --allow-same-version covers an empty suffix. This change is never
        # committed or pushed - the base version in the repo is untouched.
        run: npm version "${VERSION}" --no-git-tag-version --allow-same-version

      - name: OIDC diagnostic (pre-publish)
        # Read-only: prints node/npm versions and whether the GitHub OIDC token
        # endpoint env is present (SET/UNSET only, never the value) to settle
        # whether the id-token reaches this step. Runs regardless of dry_run.
        run: |
          echo "node: $(node --version)  npm: $(npm --version)"
          echo "ACTIONS_ID_TOKEN_REQUEST_URL: ${ACTIONS_ID_TOKEN_REQUEST_URL:+SET}${ACTIONS_ID_TOKEN_REQUEST_URL:-UNSET}"
          echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+SET}${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-UNSET}"

      - name: Publish fixowl to npm
        if: ${{ inputs.dry_run == false && steps.plan.outputs.publish_npm == 'true' }}
        working-directory: packages/cli
        env:
          NPM_TAG: ${{ steps.plan.outputs.npm_tag }}
        # No token: authentication and provenance are handled automatically over
        # OIDC because a trusted publisher is configured on npm and the job has
        # id-token: write. --provenance stays explicit for clarity.
        run: npm publish --access public --provenance --tag "${NPM_TAG}"

      - name: Push git tag
        if: ${{ inputs.dry_run == false && steps.plan.outputs.push_git_tag == 'true' }}
        env:
          GIT_TAG: ${{ steps.plan.outputs.git_tag }}
        run: |
          set -euo pipefail
          git tag "${GIT_TAG}"
          git push origin "refs/tags/${GIT_TAG}"

      - name: Move floating major tag (stable release only)
        if: ${{ inputs.dry_run == false && steps.plan.outputs.move_major == 'true' }}
        env:
          MAJOR_TAG: ${{ steps.plan.outputs.major_tag }}
        run: |
          set -euo pipefail
          git tag -f "${MAJOR_TAG}"
          git push -f origin "refs/tags/${MAJOR_TAG}"

      - name: Create GitHub Release
        if: ${{ inputs.dry_run == false }}
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_TAG: ${{ steps.plan.outputs.git_tag }}
          IS_DRAFT: ${{ steps.plan.outputs.github_draft }}
          IS_PRERELEASE: ${{ steps.plan.outputs.github_prerelease }}
        # For a draft, gh does not create the public tag until the draft is
        # published, so `draft` runs never push a ref (see Push git tag above).
        run: |
          set -euo pipefail
          args=(release create "${GIT_TAG}" --title "${GIT_TAG}" --generate-notes)
          if [ "${IS_DRAFT}" = "true" ]; then
            args+=(--draft)
          fi
          if [ "${IS_PRERELEASE}" = "true" ]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"

      - name: Dry-run summary
        if: ${{ inputs.dry_run == true }}
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          RELEASE_TYPE: ${{ steps.plan.outputs.release_type }}
          NPM_TAG: ${{ steps.plan.outputs.npm_tag }}
          PUBLISH_NPM: ${{ steps.plan.outputs.publish_npm }}
          GIT_TAG: ${{ steps.plan.outputs.git_tag }}
          PUSH_GIT_TAG: ${{ steps.plan.outputs.push_git_tag }}
          MAJOR_TAG: ${{ steps.plan.outputs.major_tag }}
          MOVE_MAJOR: ${{ steps.plan.outputs.move_major }}
          IS_DRAFT: ${{ steps.plan.outputs.github_draft }}
          IS_PRERELEASE: ${{ steps.plan.outputs.github_prerelease }}
        run: |
          {
            echo "Dry run - nothing was published or tagged."
            echo "release_type: ${RELEASE_TYPE}, composed version: ${VERSION}."
            echo "Would publish to npm: ${PUBLISH_NPM} (dist-tag '${NPM_TAG}')."
            echo "Would create git tag ${GIT_TAG} (push: ${PUSH_GIT_TAG}; move ${MAJOR_TAG}: ${MOVE_MAJOR})."
            echo "GitHub Release draft: ${IS_DRAFT}, prerelease: ${IS_PRERELEASE}."
          } >> "${GITHUB_STEP_SUMMARY}"
