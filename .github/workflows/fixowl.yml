# Generated by fixowl. Re-run `fixowl provision` to update; manual edits will be overwritten.
name: fixowl
run-name: "fixowl night run${{ github.event.inputs.source == 'scheduled-fallback' && ' [scheduled-fallback]' || '' }}"

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "Internal: the local fallback trigger sets this to scheduled-fallback; leave blank for manual runs."
        required: false
        default: ""

permissions:
  contents: read
  actions: read # the once-a-day budget guard lists this workflow's runs

concurrency:
  group: fixowl
  cancel-in-progress: false

jobs:
  fixowl:
    runs-on: [self-hosted, fixowl]
    timeout-minutes: 300
    steps:
      # Security guard: if a previous run was hard-killed mid-night, the
      # workspace .git may be one an agent container planted. Checkout must
      # never run git against it, so every night starts from a clean clone.
      - name: Reset workspace git state
        run: rm -rf "$GITHUB_WORKSPACE/.git" "$GITHUB_WORKSPACE.fixowl-git"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: NachoPal/fixowl@00e71c73fca6f45cd78bc3fe85f9284ae3c5acdb # main @ 2026-09-05
        with:
          labels-any: "for: agent"
          labels-all: ""
          agent: claude
          agent-env: "CLAUDE_CODE_OAUTH_TOKEN"
          max-issues-per-run: "10"
          issue-timeout-minutes: "45"
          source: "${{ github.event.inputs.source }}"
          schedule: "0 3 * * *"
          default-model: "opus"
          default-effort: "high"
          label-models: "{\"effort: low\":{\"model\":\"sonnet\",\"effort\":\"high\"},\"effort: medium\":{\"model\":\"opus\",\"effort\":\"high\"},\"effort: high\":{\"model\":\"opus\",\"effort\":\"high\"},\"effort: xhigh\":{\"model\":\"opus\",\"effort\":\"xhigh\"},\"effort: max\":{\"model\":\"opus\",\"effort\":\"max\"}}"
        env:
          GITHUB_TOKEN: ${{ github.token }} # Actions: read, for the once-a-day budget guard
          FIXOWL_GITHUB_TOKEN: ${{ secrets.FIXOWL_GITHUB_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: fixowl-evidence
          path: ${{ runner.temp }}/fixowl-evidence/
          if-no-files-found: ignore
