# Generated by fixowl. Re-run `fixowl provision` to update; manual edits will be overwritten.
name: fixowl
run-name: "fixowl night run${{ github.event.inputs.source == 'host-scheduler' && ' [host-scheduler]' || '' }}"

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Internal: the local host scheduler sets this to host-scheduler; leave blank for manual runs."
        required: false
        default: ""

permissions:
  contents: read
  actions: read # the once-a-day budget guard lists this workflow's runs

concurrency:
  group: fixowl
  cancel-in-progress: false

jobs:
  fixowl:
    runs-on: [self-hosted, fixowl]
    timeout-minutes: 300
    steps:
      # Security guard: if a previous run was hard-killed mid-night, the
      # workspace .git may be one an agent container planted. Checkout must
      # never run git against it, so every night starts from a clean clone.
      - name: Reset workspace git state
        run: rm -rf "$GITHUB_WORKSPACE/.git" "$GITHUB_WORKSPACE.fixowl-git"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: NachoPal/fixowl@main # main (tracks latest)
        with:
          labels-any: "for: agent"
          labels-all: ""
          agent: claude
          agent-env: "CLAUDE_CODE_OAUTH_TOKEN"
          max-issues-per-run: "10"
          issue-timeout-minutes: "120"
          max-ci-tries: "3"
          ci-timeout-minutes: "60"
          source: "${{ github.event.inputs.source }}"
          usage-budget-percent: "85"
          run-budget-minutes: "240"
          label-models: "{\"effort: high\":{\"model\":\"opus\",\"effort\":\"high\"},\"effort: low\":{\"model\":\"sonnet\",\"effort\":\"high\"},\"effort: max\":{\"model\":\"opus\",\"effort\":\"max\"},\"effort: medium\":{\"model\":\"opus\",\"effort\":\"medium\"},\"effort: xhigh\":{\"model\":\"opus\",\"effort\":\"xhigh\"}}"
        env:
          GITHUB_TOKEN: ${{ github.token }} # Actions: read, for the once-a-day budget guard
          FIXOWL_APP_ID: ${{ secrets.FIXOWL_APP_ID }}
          FIXOWL_APP_INSTALLATION_ID: ${{ secrets.FIXOWL_APP_INSTALLATION_ID }}
          FIXOWL_APP_PRIVATE_KEY: ${{ secrets.FIXOWL_APP_PRIVATE_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      # Best-effort combined upload. Per-issue `fixowl-evidence-issue-<n>`
      # artifacts (uploaded progressively as each issue finishes) are the
      # primary mechanism; this end-of-job combined artifact is only a
      # convenience fallback for a fully-successful night. Its FinalizeArtifact
      # step intermittently 403s (a cancelled-job runner reconnect, or a
      # transient artifact-service error), so it must never fail the whole run.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        continue-on-error: true
        with:
          name: fixowl-evidence
          path: ${{ runner.temp }}/fixowl-evidence/
          if-no-files-found: ignore
