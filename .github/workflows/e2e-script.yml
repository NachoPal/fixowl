# Free, deterministic end-to-end test: run the whole fixowl pipeline against the
# real sandbox with the `script` adapter (issue bodies are bash edit scripts),
# so there is ZERO LLM spend but the full real plumbing runs - selection,
# Layer-1 dependency ordering + stacking, docker build, hardened container run,
# local pre-check, real push, real PR, the CI gate, draft->ready, and cleanup.
#
# This runs the SAME zero-spend scenario suite (scripts/e2e/run-scenarios.sh) the
# release workflow's e2e-free gate runs, under the .github/actions/e2e-run wrapper
# action (a JS `uses:` step) so ACTIONS_RUNTIME_TOKEN is present and the
# evidence-kill scenario's progressive upload lands in this run. The paid,
# release-gated real-call E2E (release.yml) validates the one thing this tier
# cannot: a real agent, real auth, and the real --model/--effort flags.
#
# Cadence: on push to main, nightly, AND on pull requests targeting main so the
# suite gates a PR before it can merge (the gap that let run 34582938659's breakage
# land - the suite ran only post-merge). The shared `fixowl-e2e-sandbox` concurrency
# group (cancel-in-progress: false) still serializes every run, so a PR run queues
# behind a main/nightly/release run rather than racing the sandbox. Adds ~20-30 min
# to a same-repo PR (the captain's accepted cost).
#
# FORK PRs get no repository secrets (GitHub withholds them from untrusted forks), so
# the App trio the suite needs is absent there; those runs skip cleanly (green) with a
# clear note rather than failing red for a non-product reason. fixowl's own work lands
# on same-repo branches, where the suite runs for real and gates.
name: e2e-script

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * *" # nightly, off-peak UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fixowl-e2e-sandbox
  cancel-in-progress: false

jobs:
  e2e-script:
    name: E2E (free scenario suite against the sandbox)
    runs-on: ubuntu-latest
    timeout-minutes: 60 # the scenario suite runs many scenarios sequentially on the shared sandbox
    permissions:
      contents: read
      actions: read # list this run's evidence artifacts (evidence-kill assertion)
    env:
      SANDBOX_REPO: NachoPal/fixowl-e2e-sandbox
      E2E_MODE: free
    steps:
      # Decide whether to run the suite. The JOB always runs and completes (so it reports a
      # status context that branch protection can require on same-repo PRs); the steps below
      # are guarded on `ready` so a skip is a clean green, not a red failure. Two skip cases:
      #   - fork PR: the FIXOWL_E2E_APP_* secrets are withheld from forks, so the suite cannot
      #     authenticate; skip with a clear note (re-run after merge or on a trusted branch).
      #   - sandbox not provisioned yet: the App secrets are unset in this repo.
      - name: Check sandbox is provisioned
        id: guard
        env:
          APP_ID: ${{ secrets.FIXOWL_E2E_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.FIXOWL_E2E_APP_PRIVATE_KEY }}
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ "${IS_FORK_PR}" = "true" ]; then
            echo "Skipped: fork PR - the FIXOWL_E2E_APP_* secrets are not exposed to fork pull requests, so the free E2E scenario suite cannot run here. It runs (and gates) once the change is on a trusted same-repo branch or after merge." >> "${GITHUB_STEP_SUMMARY}"
            echo "ready=false" >> "${GITHUB_OUTPUT}"
          elif [ -z "${APP_ID}" ] || [ -z "${APP_PRIVATE_KEY}" ]; then
            echo "FIXOWL_E2E_APP_ID / FIXOWL_E2E_APP_PRIVATE_KEY not set - sandbox not provisioned yet; skipping." >> "${GITHUB_STEP_SUMMARY}"
            echo "ready=false" >> "${GITHUB_OUTPUT}"
          else
            echo "ready=true" >> "${GITHUB_OUTPUT}"
          fi

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        if: steps.guard.outputs.ready == 'true'
        with:
          app-id: ${{ secrets.FIXOWL_E2E_APP_ID }}
          private-key: ${{ secrets.FIXOWL_E2E_APP_PRIVATE_KEY }}
          owner: NachoPal
          repositories: fixowl-e2e-sandbox

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.guard.outputs.ready == 'true'
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.guard.outputs.ready == 'true'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.guard.outputs.ready == 'true'
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: steps.guard.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build the action bundle under test
        if: steps.guard.outputs.ready == 'true'
        run: pnpm build

      - name: Checkout the sandbox repo
        if: steps.guard.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NachoPal/fixowl-e2e-sandbox
          token: ${{ steps.app-token.outputs.token }}
          path: sandbox
          fetch-depth: 0
          persist-credentials: false # the action pushes with its own App token

      - name: Run the free scenario suite
        if: steps.guard.outputs.ready == 'true'
        uses: ./.github/actions/e2e-run
        with:
          # Suite mode: the wrapper spawns the runner as a child so it (and every `node`
          # it runs) inherits ACTIONS_RUNTIME_TOKEN - the one thing a `run:` step cannot get.
          command: bash scripts/e2e/run-scenarios.sh
        env:
          SANDBOX_REPO: NachoPal/fixowl-e2e-sandbox
          GH_TOKEN: ${{ steps.app-token.outputs.token }} # fixture gh calls only; never the agent's
          FIXOWL_APP_ID: ${{ secrets.FIXOWL_E2E_APP_ID }}
          FIXOWL_APP_INSTALLATION_ID: ${{ steps.app-token.outputs.installation-id }}
          FIXOWL_APP_PRIVATE_KEY: ${{ secrets.FIXOWL_E2E_APP_PRIVATE_KEY }}
          FIXOWL_SELF_TOKEN: ${{ github.token }}
          FIXOWL_SELF_REPO: ${{ github.repository }}
          FIXOWL_RUN_ID: ${{ github.run_id }}

      - name: Coverage honesty
        if: always() && steps.guard.outputs.ready == 'true'
        run: |
          {
            echo "### Coverage honesty"
            echo "Deterministic, zero-LLM plumbing test (the free scenario suite). Does **NOT** cover"
            echo "the real agent / auth / --model / --effort path (that is the release-gated paid E2E),"
            echo "nor self-hosted runner registration, the launchd fallback, or the scheduled-slot guard."
          } >> "${GITHUB_STEP_SUMMARY}"
