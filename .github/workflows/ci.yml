name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install actionlint (pinned)
        run: |
          curl -sSfL -o /tmp/actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/actionlint.tar.gz -C "$HOME/.local/bin" actionlint
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: actionlint (repo workflows)
        run: actionlint

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Bundle freshness
        run: |
          pnpm build
          git diff --exit-code -- dist

      # In-process whole-night against a REAL Docker engine (real git, real image build, real
      # hardened container runs, fake GitHub). Asserts the git-dir extraction, the planted-hook
      # non-execution, the runtime-token non-leak, the evidence file layout, and that pnpm
      # resolves offline as a non-root container user (T3-pnpm). Ubuntu runners ship Docker.
      - name: Docker E2E (pnpm e2e:docker)
        run: pnpm e2e:docker
