# Configures the auto-generated release notes produced by
# `gh release create --generate-notes` (see .github/workflows/release.yml).
#
# NOTE: GitHub's `categories` and `exclude` match on PR **labels** and
# **authors**, not title prefixes. Today this repo relies on
# conventional-commit PR titles and applies no labels to PRs, so most
# category buckets below stay empty and merged PRs fall through to the
# catch-all "Other changes" section. To get richer grouping (Features /
# Fixes / Docs split out) and to filter human-authored noise (e.g. the
# repeated "Bump version" PRs), start labeling PRs: `enhancement`, `bug`,
# `documentation` for the categories, and `ignore-for-release` on
# version-bump / CI-plumbing PRs to drop them from the notes.
# Schema: https://docs.github.com/repositories/releasing-projects-on-github/automatically-generated-release-notes
changelog:
  exclude:
    # Drop PRs carrying these labels (apply `ignore-for-release` to
    # version-bump / plumbing PRs you don't want in the notes).
    labels:
      - ignore-for-release
      - dependencies
    authors:
      - dependabot
      - dependabot[bot]
      - github-actions
      - github-actions[bot]
  categories:
    - title: "🚀 Features"
      labels:
        - enhancement
    - title: "🐛 Fixes"
      labels:
        - bug
    - title: "📖 Documentation"
      labels:
        - documentation
    # Catch-all: every merged PR not captured above (the current default,
    # since PRs are unlabeled today).
    - title: "Other changes"
      labels:
        - "*"
