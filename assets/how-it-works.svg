<?xml version="1.0" encoding="UTF-8"?>
<svg id="fxfig" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1060" width="1240" height="1060" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="fxDesc">
  <desc id="fxDesc">A high-level architecture map with four locations. Your machine runs the fixowl CLI and a host scheduler, and is where you file, label and review. GitHub holds the App identity, the issues labeled overnight, the workflow and sealed secrets, the required CI checks, and the pull requests. The runner host runs the self-hosted (or GitHub-hosted) runner and the fixowl Action, which spawns one per-issue Docker container that runs the coding agent. Ten numbered steps, colored violet for one-time setup, green for the nightly run and amber for morning review, trace setup, issue selection, running the agent in a container, opening one draft PR, the CI-gated loop, the flip from draft to ready, and your morning review. fixowl never merges.</desc>

  <style>
    #fxfig text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    #fxfig .bg      { fill: #0a0f1e; }
    #fxfig .zone    { fill: #101a33; stroke: #24314f; stroke-width: 1.5; }
    #fxfig .box     { fill: #16203a; stroke: #2b3a5c; stroke-width: 1.5; }
    #fxfig .boxlg   { fill: #1b2745; stroke: #2b3a5c; stroke-width: 1.5; }
    #fxfig .ctr     { fill: #101a33; stroke: #4ade80; stroke-width: 1.6; stroke-dasharray: 5 4; }
    #fxfig .title   { fill: #f2ede3; font-weight: 700; font-size: 27px; letter-spacing: -.01em; }
    #fxfig .subttl  { fill: #9fb0cc; font-size: 15px; }
    #fxfig .zt      { fill: #f2ede3; font-weight: 700; font-size: 15px; letter-spacing: .04em; }
    #fxfig .zsub    { fill: #6b7f9e; font-size: 12px; }
    #fxfig .t       { fill: #f2ede3; font-weight: 650; font-size: 15px; }
    #fxfig .ts      { fill: #9fb0cc; font-size: 12.5px; }
    #fxfig .tsm     { fill: #6b7f9e; font-size: 11.5px; }
    #fxfig .mn      { fill: #c4b5fd; font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    #fxfig .amberT  { fill: #fbbf24; font-weight: 700; }
    #fxfig .pillA   { fill: #131d36; stroke: #fbbf24; stroke-width: 1.4; }
    #fxfig .pillG   { fill: #131d36; stroke: #4ade80; stroke-width: 1.4; }
    #fxfig .pillAt  { fill: #fbbf24; font-weight: 700; font-size: 13px; }
    #fxfig .pillGt  { fill: #4ade80; font-weight: 700; font-size: 13px; }
    #fxfig .ev      { stroke: #a78bfa; stroke-width: 2.2; fill: none; marker-end: url(#mv); }
    #fxfig .eg      { stroke: #4ade80; stroke-width: 2.2; fill: none; marker-end: url(#mg); }
    #fxfig .egb     { stroke: #4ade80; stroke-width: 2.2; fill: none; marker-end: url(#mg); marker-start: url(#mg); }
    #fxfig .ea      { stroke: #fbbf24; stroke-width: 2.2; fill: none; marker-end: url(#ma); }
    #fxfig .thin    { stroke: #6b7f9e; stroke-width: 1.4; fill: none; marker-end: url(#mm); stroke-dasharray: 3 4; }
    #fxfig .nb      { fill: #a78bfa; }
    #fxfig .nb.g    { fill: #4ade80; }
    #fxfig .nb.a    { fill: #fbbf24; }
    #fxfig .nbt     { fill: #0a0f1e; font-weight: 700; font-size: 12px; }
    #fxfig .lgh     { fill: #a78bfa; font-weight: 700; font-size: 13px; letter-spacing: .12em; }
    #fxfig .lgt     { fill: #dbe4f0; font-size: 13.5px; }
    #fxfig .lgf     { fill: #9fb0cc; font-size: 12.5px; }
  </style>

  <defs>
    <marker id="mv" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 z" fill="#a78bfa"/></marker>
    <marker id="mg" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 z" fill="#4ade80"/></marker>
    <marker id="ma" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 z" fill="#fbbf24"/></marker>
    <marker id="mm" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L9,3.5 L0,7 z" fill="#6b7f9e"/></marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1240" height="1060" rx="18"/>

  <!-- ===== HEADER ===== -->
  <text class="subttl" x="40" y="80">Four locations, ten steps — you set it up once, then every night it opens one draft PR per issue.</text>

  <!-- ===== ZONES ===== -->
  <rect class="zone" x="40"  y="150" width="326" height="600" rx="16"/>
  <rect class="zone" x="398" y="150" width="360" height="600" rx="16"/>
  <rect class="zone" x="822" y="150" width="378" height="600" rx="16"/>

  <text class="zt"   x="62"  y="140">💻  YOUR MACHINE</text>
  <text class="zt"   x="420" y="140">🐙  GITHUB · your repo</text>
  <text class="zt"   x="844" y="140">🖥️  RUNNER HOST</text>
  <text class="zsub" x="844" y="176">self-hosted · or GitHub-hosted (cloud)</text>

  <!-- ===== ZONE A: YOUR MACHINE ===== -->
  <rect class="box" x="58" y="190" width="290" height="104" rx="11"/>
  <text class="t"   x="76" y="222">fixowl CLI</text>
  <text class="ts"  x="76" y="246">init · provision · start · run</text>
  <text class="tsm" x="76" y="268">your command-line tool — where setup happens</text>

  <rect class="box" x="58" y="322" width="290" height="76" rx="11"/>
  <text class="t"   x="76" y="352">Host scheduler</text>
  <text class="ts"  x="76" y="374">launchd — dispatches the night on time</text>

  <rect class="box" x="58" y="628" width="290" height="104" rx="11"/>
  <text class="t"   x="76" y="660">You (the operator)</text>
  <text class="ts"  x="76" y="684">file &amp; label issues during the day</text>
  <text class="ts"  x="76" y="704">review pull requests in the morning</text>

  <!-- ===== ZONE B: GITHUB ===== -->
  <rect class="box" x="416" y="190" width="326" height="72" rx="11"/>
  <text class="t"   x="434" y="220">GitHub App — the night's identity</text>
  <text class="ts"  x="434" y="244">least-privilege installation token</text>

  <rect class="box" x="416" y="282" width="326" height="72" rx="11"/>
  <text class="t"   x="434" y="312">Open issues labeled <tspan class="mn">overnight</tspan></text>
  <text class="ts"  x="434" y="336">selected &amp; ordered by native blocked-by</text>

  <rect class="box" x="416" y="374" width="326" height="84" rx="11"/>
  <text class="t"   x="434" y="404">Workflow  +  sealed secrets</text>
  <text class="ts"  x="434" y="428">committed via PR · GitHub cron / host trigger</text>

  <rect class="box" x="416" y="478" width="326" height="70" rx="11"/>
  <text class="t"   x="434" y="508">Required CI checks</text>
  <text class="ts"  x="434" y="532">the authority — green flips draft → ready</text>

  <rect class="boxlg" x="416" y="566" width="326" height="126" rx="11"/>
  <text class="t"   x="434" y="596">Pull request — one per issue</text>
  <rect class="pillA" x="434" y="612" width="88" height="28" rx="14"/>
  <text class="pillAt" x="478" y="631" text-anchor="middle">DRAFT</text>
  <path class="eg" d="M530,626 H548"/>
  <rect class="pillG" x="556" y="612" width="118" height="28" rx="14"/>
  <text class="pillGt" x="615" y="631" text-anchor="middle">READY ✓</text>
  <text class="mn"  x="434" y="664">branch  issue/&lt;n&gt;-&lt;slug&gt;</text>
  <text class="ts amberT" x="434" y="684">fixowl NEVER merges</text>

  <!-- ===== ZONE C: RUNNER HOST ===== -->
  <rect class="box" x="840" y="194" width="342" height="62" rx="11"/>
  <text class="t"   x="858" y="222">Self-hosted runner service</text>
  <text class="tsm" x="858" y="242">a native process on the host</text>

  <rect class="boxlg" x="840" y="284" width="342" height="286" rx="12"/>
  <text class="t"   x="858" y="312">fixowl Action</text>
  <text class="tsm" x="858" y="332">the committed <tspan class="mn">dist/action</tspan> bundle</text>
  <text class="tsm" x="858" y="352">host commits &amp; pushes the branch</text>

  <rect class="ctr" x="860" y="372" width="302" height="176" rx="11"/>
  <text class="t"   x="878" y="402">Per-issue Docker container</text>
  <text class="ts"  x="878" y="426">runs the coding agent</text>
  <text class="ts"  x="878" y="446">claude / codex</text>
  <line x1="878" y1="460" x2="1144" y2="460" stroke="#2b3a5c" stroke-width="1"/>
  <text class="tsm" x="878" y="484">one ephemeral container per issue</text>
  <text class="tsm" x="878" y="504">edits only the working tree</text>
  <text class="tsm" x="878" y="524">exactly one level of containerization</text>

  <!-- ===== ARROWS (clean orthogonal lanes) ===== -->

  <!-- 3: CLI -> runner (top lane, above everything); riser at x=300 clears the YOUR MACHINE label -->
  <path class="ev" d="M300,190 V112 H1100 V194"/>
  <circle class="nb" cx="560" cy="112" r="12"/><text class="nbt" x="560" y="116.5" text-anchor="middle">3</text>

  <!-- 1: CLI -> App -->
  <path class="ev" d="M348,224 H416"/>
  <circle class="nb" cx="382" cy="224" r="12"/><text class="nbt" x="382" y="228.5" text-anchor="middle">1</text>

  <!-- 2: CLI -> Workflow/secrets -->
  <path class="ev" d="M348,258 H382 V416 H416"/>
  <circle class="nb" cx="382" cy="336" r="12"/><text class="nbt" x="382" y="340.5" text-anchor="middle">2</text>

  <!-- schedule feeder (secondary, thin) -->
  <path class="thin" d="M348,360 H392 V398 H416"/>

  <!-- 4: workflow -> runner (dispatch); lane x=792 upper -->
  <path class="eg" d="M742,404 H792 V216 H840"/>
  <circle class="nb g" cx="792" cy="300" r="12"/><text class="nbt" x="792" y="304.5" text-anchor="middle">4</text>

  <!-- 5: issues -> Action (single clean crossing of lane 4) -->
  <path class="eg" d="M742,318 H840"/>
  <circle class="nb g" cx="774" cy="318" r="12"/><text class="nbt" x="774" y="322.5" text-anchor="middle">5</text>

  <!-- 6: Action -> container (run agent) -->
  <path class="eg" d="M1120,356 V372"/>
  <circle class="nb g" cx="1120" cy="346" r="12"/><text class="nbt" x="1120" y="350.5" text-anchor="middle">6</text>

  <!-- 8: CI checks <-> Action (poll + feed failures back); lane x=792 lower -->
  <path class="egb" d="M742,512 H792 V452 H840"/>
  <circle class="nb g" cx="792" cy="482" r="12"/><text class="nbt" x="792" y="486.5" text-anchor="middle">8</text>

  <!-- 7: Action -> PR (push + open draft); lane x=806 -->
  <path class="eg" d="M840,540 H806 V610 H742"/>
  <circle class="nb g" cx="806" cy="575" r="12"/><text class="nbt" x="806" y="579.5" text-anchor="middle">7</text>

  <!-- 9: CI green -> flip draft to ready (inside GitHub) -->
  <path class="eg" d="M579,548 V566"/>
  <circle class="nb g" cx="579" cy="557" r="12"/><text class="nbt" x="579" y="561.5" text-anchor="middle">9</text>

  <!-- 10: PR -> operator (review) -->
  <path class="ea" d="M416,650 H378 V680 H348"/>
  <circle class="nb a" cx="378" cy="665" r="12"/><text class="nbt" x="378" y="669.5" text-anchor="middle">10</text>

  <!-- faint internal GitHub pipeline spine -->
  <path class="thin" d="M579,354 V374" opacity="0.5"/>
  <path class="thin" d="M579,458 V478" opacity="0.5"/>

  <!-- ===== NUMBERED LEGEND ===== -->
  <line x1="40" y1="792" x2="1200" y2="792" stroke="#24314f" stroke-width="1.5"/>
  <text class="lgh" x="40" y="822">THE STEPS</text>
  <circle cx="150" cy="817" r="6" fill="#a78bfa"/><text class="lgf" x="162" y="822">setup</text>
  <circle cx="228" cy="817" r="6" fill="#4ade80"/><text class="lgf" x="240" y="822">every night</text>
  <circle cx="342" cy="817" r="6" fill="#fbbf24"/><text class="lgf" x="354" y="822">morning</text>

  <!-- legend column 1 -->
  <circle class="nb"   cx="52" cy="858" r="11"/><text class="nbt" x="52" y="862" text-anchor="middle">1</text>
  <text class="lgt" x="74" y="863">CLI creates &amp; installs the GitHub App</text>
  <circle class="nb"   cx="52" cy="894" r="11"/><text class="nbt" x="52" y="898" text-anchor="middle">2</text>
  <text class="lgt" x="74" y="899">CLI provisions repo: labels · secrets · workflow (PR)</text>
  <circle class="nb"   cx="52" cy="930" r="11"/><text class="nbt" x="52" y="934" text-anchor="middle">3</text>
  <text class="lgt" x="74" y="935">CLI installs &amp; starts the runner service</text>
  <circle class="nb g" cx="52" cy="966" r="11"/><text class="nbt" x="52" y="970" text-anchor="middle">4</text>
  <text class="lgt" x="74" y="971">Nightly schedule dispatches the job to the runner</text>
  <circle class="nb g" cx="52" cy="1002" r="11"/><text class="nbt" x="52" y="1006" text-anchor="middle">5</text>
  <text class="lgt" x="74" y="1007">Action selects overnight issues (by blocked-by)</text>

  <!-- legend column 2 -->
  <circle class="nb g" cx="642" cy="858" r="11"/><text class="nbt" x="642" y="862" text-anchor="middle">6</text>
  <text class="lgt" x="664" y="863">Agent runs in a per-issue Docker container</text>
  <circle class="nb g" cx="642" cy="894" r="11"/><text class="nbt" x="642" y="898" text-anchor="middle">7</text>
  <text class="lgt" x="664" y="899">Host pushes the branch &amp; opens one draft PR</text>
  <circle class="nb g" cx="642" cy="930" r="11"/><text class="nbt" x="642" y="934" text-anchor="middle">8</text>
  <text class="lgt" x="664" y="935">CI-gated loop waits for the repo's required checks</text>
  <circle class="nb g" cx="642" cy="966" r="11"/><text class="nbt" x="642" y="970" text-anchor="middle">9</text>
  <text class="lgt" x="664" y="971">Green flips draft → READY; red retries, else annotated</text>
  <circle class="nb a" cx="642" cy="1002" r="11"/><text class="nbt" x="642" y="1006" text-anchor="middle">10</text>
  <text class="lgt" x="664" y="1007">Morning: you review the ready PRs — never merges</text>

  <text class="lgf" x="40" y="1044">Where it runs:  your machine  ·  GitHub  ·  the self-hosted runner host  ·  a per-issue Docker container</text>
</svg>
