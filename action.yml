name: fixowl
description: >-
  The owl that fixes your issues while you sleep. Picks up labeled open issues,
  runs a coding agent in a Docker container per issue, verifies the change when
  possible, and opens exactly one PR per issue. Never merges.
author: NachoPal
branding:
  icon: moon
  color: purple

inputs:
  labels-any:
    description: Comma-separated labels; an issue matches if it has ANY of them.
    required: false
    default: overnight
  labels-all:
    description: Comma-separated labels; an issue matches only if it has ALL of them.
    required: false
    default: ""
  agent:
    description: >-
      Agent adapter to run (claude, aider). "script" is test-only: it executes
      issue bodies as shell and is refused unless FIXOWL_UNSAFE_SCRIPT_AGENT=1
      is set in the workflow env.
    required: false
    default: claude
  agent-env:
    description: >-
      Comma-separated env var names allowed into the agent container,
      overriding the adapter's built-in allowlist. Empty keeps the default.
    required: false
    default: ""
  max-issues-per-run:
    description: Maximum number of issues to process in one run.
    required: false
    default: "4"
  issue-timeout-minutes:
    description: Hard timeout for the agent container per issue.
    required: false
    default: "45"
  default-model:
    description: >-
      Model id the agent runs with when an issue carries none of the selector
      labels. Empty passes no --model, using the agent CLI's own default.
    required: false
    default: ""
  default-effort:
    description: >-
      Reasoning effort level for the default model. Empty passes no effort flag.
    required: false
    default: ""
  label-models:
    description: >-
      JSON object mapping a selector label name to {"model","effort"}. An issue
      with exactly one of these labels runs with that model/effort; two or more
      fails that issue loudly. Empty means no per-label selection.
    required: false
    default: ""
  heuristic-conflict-ordering:
    description: >-
      Opt-in Layer 2: run the LLM same-files classifier that groups and stacks
      non-dependent issues to reduce merge conflicts. Off by default (fixowl
      never merges, so it never restacks; independent PRs review more robustly,
      and the classifier is a paid LLM guess). Native blocked_by ordering
      (Layer 1) is always-on regardless. Set "true" to enable.
    required: false
    default: "false"
  source:
    description: >-
      Internal. Set to "scheduled-fallback" by fixowl's local fallback trigger so
      the run counts as the scheduled slot for the once-a-day budget guard. Left
      blank for the cron and for manual runs.
    required: false
    default: ""
  schedule:
    description: >-
      Internal. The workflow's cron expression (UTC), passed by the generated
      workflow so the once-a-day budget guard anchors its "already ran" window to
      the schedule occurrence instead of the UTC calendar day (correct across UTC
      midnight). Empty degrades to the calendar day.
    required: false
    default: ""

runs:
  using: node24
  main: dist/action/index.js
